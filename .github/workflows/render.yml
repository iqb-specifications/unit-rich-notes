on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Generate HTML and Publish

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Validate schema examples
        run: npm run validate-schema

  deploy-build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare repo
        run: |
          git fetch origin main gh-pages
          git config --global user.email "mechtel@iqb.hu-berlin.de"
          git config --global user.name "Martin Mechtel"
          git checkout -B gh-pages origin/gh-pages
          git reset --hard origin/main
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Validate schema examples
        run: npm run validate-schema
      - name: Run HTML generation
        run: |
          npm run generate_docs
          rm -rf docs
          mv public docs
      - name: Push changes
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "update gh-pages"
          git push -f origin gh-pages
